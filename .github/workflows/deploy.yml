# Push to main → tests → the `release` branch is moved to main.
# Dokploy watches `release` through its GitHub app (Trigger Type: On Push), so
# the box rebuilds only from commits the tests have passed. No webhook, no
# secret: what is live is always what `release` points at.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # `gh workflow run deploy` re-releases main by hand

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: move release to main
        run: git push origin HEAD:release
