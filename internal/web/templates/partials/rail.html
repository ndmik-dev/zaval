{{define "rail"}}<nav class="rail">
  <a class="brand" href="/" title="Day Board" aria-label="Day Board">
    <svg width="19" height="19" viewBox="0 0 18 18" aria-hidden="true"><rect x="1.6" y="3" width="14.8" height="13" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.6 7h14.8M5.6 1.6v3M12.4 1.6v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M6 11.2l1.7 1.7 3.6-3.6" fill="none" stroke="#2F5D50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>

  <div class="nav-group">
    <a class="nav{{if eq .Nav "board"}} active{{end}}" href="/" title="Дошка">
      <svg width="16" height="16" viewBox="0 0 14 14" aria-hidden="true"><rect x="1.4" y="1.8" width="4.6" height="10.4" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="8" y="1.8" width="4.6" height="6.2" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      <span class="nav-label">Дошка</span>
    </a>
    <a class="nav{{if eq .Nav "releases"}} active{{end}}" href="/releases" title="Релізи">
      <svg width="16" height="16" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 3.4h10M2 7h10M2 10.6h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M9.4 9.6l1.4 1.4 2.2-2.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="nav-label">Релізи</span>
    </a>
    <a class="nav{{if eq .Nav "journal"}} active{{end}}" href="/journal" title="Журнал">
      <svg width="16" height="16" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1.6" width="10" height="10.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.6 5h4.8M4.6 7.6h4.8M4.6 10.2h2.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span class="nav-label">Журнал</span>
    </a>
  </div>

  <div class="nav-group rail-bottom">
    <button type="button" class="nav" data-open-palette title="Додати або знайти (⌘K)">
      <svg width="16" height="16" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2.4v9.2M2.4 7h9.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="nav-label">Додати</span>
    </button>
    <a class="nav{{if eq .Nav "projects"}} active{{end}}" href="/projects" title="Проєкти">
      <svg width="16" height="16" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 1.6v1.8M7 10.6v1.8M1.6 7h1.8M10.6 7h1.8M3.2 3.2l1.3 1.3M9.5 9.5l1.3 1.3M3.2 10.8l1.3-1.3M9.5 4.5l1.3-1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span class="nav-label">Проєкти</span>
    </a>
    {{if .AuthOn}}<form method="post" action="/logout"><button type="submit" class="nav logout" title="Вийти">
      <svg width="16" height="16" viewBox="0 0 14 14" aria-hidden="true"><path d="M8.6 2.4H3.4v9.2h5.2M6.6 7h5M9.4 5l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="nav-label">Вийти</span>
    </button></form>{{end}}
  </div>
</nav>{{end}}
