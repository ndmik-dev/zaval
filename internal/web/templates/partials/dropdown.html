{{define "dropdown"}}
{{/* Custom select: hidden input + button + menu. app.js wires it; Items need ID, Name, Color (Slug is matched against Selected). */}}
<div class="dd" data-dd>
  <input type="hidden" name="{{.Name}}" value="{{range .Items}}{{if eq .Slug $.Selected}}{{.ID}}{{end}}{{end}}">
  <button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false">
    {{range .Items}}{{if eq .Slug $.Selected}}<span class="dot" style="background:{{.Color}}"></span><span class="dd-label">{{.Name}}</span>{{end}}{{end}}
    <svg class="dd-chevron" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.6 4.4 6 7.8l3.4-3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="dd-menu" role="listbox" hidden>
    {{range .Items}}<button type="button" role="option" data-value="{{.ID}}" data-color="{{.Color}}"{{if eq .Slug $.Selected}} aria-selected="true"{{end}}><span class="dot" style="background:{{.Color}}"></span>{{.Name}}</button>{{end}}
  </div>
</div>
{{end}}
