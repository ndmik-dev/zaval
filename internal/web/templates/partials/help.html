{{define "help"}}
<dialog id="help" class="help-dialog">
  <div class="help-head"><span class="up">Клавіатура</span><span class="grow"></span><button type="button" class="x" data-close-help aria-label="Закрити">✕</button></div>
  <div class="help-grid">
    <kbd>⌘K</kbd><span>додати або знайти задачу</span>
    <kbd>/</kbd><span>пошук по дошці</span>
    <kbd>j</kbd><span>наступний рядок</span>
    <kbd>k</kbd><span>попередній рядок</span>
    <kbd>Enter</kbd><span>відкрити картку</span>
    <kbd>x</kbd><span>готово</span>
    <kbd>f</kbd><span>у Зараз / у беклог</span>
    <kbd>w</kbd><span>чекаю на…</span>
    <kbd>l</kbd><span>додати лінк</span>
    <kbd>d</kbd><span>показати / сховати дейлі</span>
    <kbd>1 2 3</kbd><span>Дошка / Релізи / Журнал</span>
    <kbd>Esc</kbd><span>закрити</span>
    <kbd>?</kbd><span>ця підказка</span>
  </div>
</dialog>
{{end}}
