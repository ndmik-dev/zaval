{{define "layout"}}<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EAE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" href="/static/icon-192.png">
<title>{{.Title}} — Day Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{static "app.css"}}">
<script src="{{static "htmx.min.js"}}" defer></script>
<script src="{{static "sortable.min.js"}}" defer></script>
<script src="{{static "app.js"}}" defer></script>
</head>
<body>
{{template "app" .}}
</body>
</html>{{end}}

{{define "app"}}<div class="app" id="app" hx-target:inherited="#app" hx-swap:inherited="outerMorph" hx-include:inherited="#q, #daily-state">
  {{template "rail" .}}
  <main class="main">{{template "content" .}}</main>
  {{if .Open}}{{template "drawer" .}}{{end}}
  {{template "palette" .}}
  {{template "help" .}}
  <dialog id="confirm" class="confirm-dialog">
    <p class="confirm-text"></p>
    <div class="confirm-actions">
      <button type="button" class="btn" data-confirm-cancel>Скасувати</button>
      <button type="button" class="btn primary" data-confirm-accept>OK</button>
    </div>
  </dialog>
</div>{{end}}
